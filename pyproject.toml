[build-system]
requires = ["setuptools==70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cybwaysql"
version = "0.1.0"
description = "Cybwaysql - an assurance harness for LLM-generated Oracle SQL (static review, no execution, $0)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "V. Vikram" }]
keywords = ["text-to-sql", "oracle", "llm", "guardrails", "ai governance",
            "sql injection", "data access control", "model evaluation", "PII"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Security",
]
# Stdlib only. A governance tool whose core is a dependency nobody has read is
# not much of a governance tool.
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.2.2"]

[project.scripts]
cybwaysql = "cybwaysql.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
